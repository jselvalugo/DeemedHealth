# Rule shapes: board-approval-backed; periodic evaluation.
id: CM-19-POLICY-SFDP
chapter: 19
title: Board approves and re-evaluates the sliding fee discount policies
statement: >-
  The governing board adopts the sliding fee discount program policies,
  approves changes to them, and evaluates them on a set schedule (assumed to be
  at least every three years).
layer: requirement
