# Rule shape: one-time document (on_change). Layer payer_rule: a Medicaid rule, not an HRSA requirement.
id: MCD-71109-NONCITIZEN-ELIGIBILITY-IMPACT
chapter: 9
title: Plan for patients losing full Medicaid under the non-citizen eligibility change
statement: >-
  From October 1, 2026, full federally funded Medicaid and CHIP is limited to
  lawful permanent residents, Cuban and Haitian entrants, and COFA migrants.
  Refugees, asylees, and humanitarian parolees outside those groups lose full
  coverage; emergency Medicaid remains. Florida reports that lawfully residing
  children 18 and under stay eligible. The health center reviews what this does
  to its sliding fee discount program (Ch. 9), budget (Ch. 17), and billing and
  collections (Ch. 16), and updates patient notices. The suite tracks aggregate
  counts only and never stores a patient's immigration or eligibility status.
