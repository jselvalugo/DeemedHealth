# Payer-rule catalog entries (layer: payer_rule). Owner: hrsa-regulatory-analyst.
# Mirrors CLAUDE.md "Medicare and Medicaid rules in effect", rows R1-R3.
#
# All entries are status: draft. Drafted 2026-09-29 from web-search summaries
# only: cms.gov and medicaid.gov were blocked by the session proxy, so no
# official text was read. Every value in `parameters` is a planning value to
# check against the source before `status: verified`. Never verify from memory.
#
# Money and multipliers are decimal strings, not floats, so they survive
# round-trips without binary rounding (CLAUDE.md: round once, at the end).
entries:
  - id: CMS-FQHC-TELEHEALTH-DISTANT-SITE-BILLING
    chapter: 16
    title: Bill Medicare distant-site telehealth with individual codes, not G2025
    statement: >-
      From October 1, 2026, an FQHC bills Medicare for a distant-site telehealth
      service with the CPT or HCPCS code for the service itself, a telehealth
      modifier (95 for audio-video, 93 for audio-only), and the revenue code,
      instead of the single code G2025. Service lines under the behavioral health
      revenue code 0900 are reported to follow different rules. The health
      center's billing and collections policies and telehealth procedures
      (Compliance Manual Ch. 16) should match, and a policy change goes to the
      board where the board approves billing policies (Ch. 19).
    layer: payer_rule
    sources:
      - key: CMS-MM14468
        locator: "MLN MM14468 / CR 14468 (whole article)"
        url: null
        verifiedOn: null
        verifiedBy: null
      - key: CM
        locator: "Chapter 16, Billing and Collections; Chapter 19, Board Authority"
        url: null
        verifiedOn: null
        verifiedBy: null
    appliesTo:
      awardTypes: [section330, lookalike]
    notApplicable:
      allowed: true
      reason: The health center does not furnish distant-site telehealth services to Medicare patients.
    evidence:
      - billing_collections_policy
      - telehealth_billing_procedure
      - board_approval_record
    cadence:
      trigger: on_effective_date
      renewalMonths: null
      leadDays: [30, 7]
    parameters:
      replacedHcpcs: G2025
      modifiers:
        audioVideo: "95"
        audioOnly: "93"
      excludedRevenueCodes: ["0900"]
      claimsSystemsDate: "2026-10-05"
      distantSitePaymentRate:
        calendarYear: 2026
        amount: "97.53"
    severity: high
    effective: { from: "2026-10-01", to: null }
    supersedes: []
    status: draft

  - id: MCD-71109-NONCITIZEN-ELIGIBILITY-IMPACT
    chapter: 9
    title: Plan for patients losing full Medicaid under the non-citizen eligibility change
    statement: >-
      From October 1, 2026, full federally funded Medicaid and CHIP is limited to
      lawful permanent residents, Cuban and Haitian entrants, and COFA migrants.
      Refugees, asylees, and humanitarian parolees outside those groups lose full
      coverage; emergency Medicaid remains. Florida reports that lawfully residing
      children 18 and under stay eligible. The health center reviews what this does
      to its sliding fee discount program (Ch. 9), budget (Ch. 17), and billing and
      collections (Ch. 16), and updates patient notices. The suite tracks aggregate
      counts only and never stores a patient's immigration or eligibility status.
    layer: payer_rule
    sources:
      - key: PL-119-21
        locator: "§71109"
        url: null
        verifiedOn: null
        verifiedBy: null
      - key: MCD-SHO-26-001
        locator: "SHO #26-001 (whole letter)"
        url: null
        verifiedOn: null
        verifiedBy: null
      - key: FL-DCF-71109
        locator: "Florida implementation notice (to be located)"
        url: null
        verifiedOn: null
        verifiedBy: null
      - key: CM
        locator: "Chapter 9, Sliding Fee Discount Program; Chapter 16; Chapter 17, Budget"
        url: null
        verifiedOn: null
        verifiedBy: null
    appliesTo:
      awardTypes: [section330, lookalike]
      jurisdiction: florida
    notApplicable:
      allowed: false
    evidence:
      - sfdp_impact_review
      - budget_reforecast
      - board_approval_record
      - patient_notice_update
    cadence:
      trigger: on_effective_date
      renewalMonths: null
      leadDays: [30, 7]
    parameters:
      keptCategories:
        - lawful_permanent_resident
        - cuban_haitian_entrant
        - cofa_migrant
      losingCategories:
        - refugee
        - asylee
        - humanitarian_parolee
      emergencyMedicaidUnchanged: true
      floridaLawfullyResidingChildrenMaxAge: 18
      patientLevelData: aggregate_only
    severity: medium
    effective: { from: "2026-10-01", to: null }
    supersedes: []
    status: draft

  - id: CMS-FQHC-PPS-RATE-CY2026
    chapter: 17
    title: Medicare FQHC PPS rate for calendar year 2026
    statement: >-
      For services from January 1 through December 31, 2026, the Medicare FQHC
      prospective payment system national base rate is $207.72. It is multiplied
      by 1.3416 for a new patient, an initial preventive physical examination, or
      an annual wellness visit, and by the geographic adjustment factor for the
      site's Medicare locality. Medicare pays 80% of the lesser of the health
      center's charge or the adjusted rate. The suite uses these values only for
      budget (Ch. 17) and fee-schedule (Ch. 16) context, never to price a claim.
    layer: payer_rule
    sources:
      - key: CMS-FQHC-PPS-2026
        locator: "CY 2026 FQHC PPS rate update (whole transmittal)"
        url: null
        verifiedOn: null
        verifiedBy: null
      - key: CMS-PFS-2026
        locator: "FQHC PPS section of the final rule"
        url: null
        verifiedOn: null
        verifiedBy: null
    appliesTo:
      awardTypes: [section330, lookalike]
    notApplicable:
      allowed: false
    evidence: []
    cadence:
      trigger: annual_cms_pfs_final_rule
      renewalMonths: 12
      leadDays: []
    parameters:
      calendarYear: 2026
      baseRate: "207.72"
      priorYearBaseRate: "202.65"
      qualifyingVisitMultiplier: "1.3416"
      qualifyingVisits: [new_patient, ippe, awv]
      awvHcpcs: [G0438, G0439]
      geographicAdjustment: per_site_medicare_locality
      medicarePaysPercent: "80"
      rounding: round_to_cent_once_at_end  # CMS rounding method not yet confirmed
    severity: low
    effective: { from: "2026-01-01", to: "2026-12-31" }
    supersedes: []
    status: draft
