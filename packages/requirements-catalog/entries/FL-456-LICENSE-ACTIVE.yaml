# Rule shape: expiration with lead days. Florida state rule, never labeled HRSA.
id: FL-456-LICENSE-ACTIVE
chapter: null
title: Hold an active Florida license (Florida requirement)
statement: >-
  Florida requires each licensed practitioner to hold an active Florida license
  for their profession and to renew it before it expires. License status is
  checked on the Florida Department of Health license lookup.
