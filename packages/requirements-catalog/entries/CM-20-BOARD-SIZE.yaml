# Rule shape: fixed catalog thresholds, re-checked on change.
id: CM-20-BOARD-SIZE
chapter: 20
title: Board has 9 to 25 members
statement: >-
  The governing board has at least 9 and no more than 25 members, as the bylaws
  set out. The count is checked again whenever a member joins or leaves.
layer: requirement
