# Rule shapes: periodic cadence; board-approval-backed.
id: CM-19-BUDGET-ANNUAL
chapter: 19
title: Board approves the annual budget
statement: >-
  Each year the governing board approves the health center's annual budget for
  the whole project, including non-grant revenue. Staff cannot record this
  approval on the board's behalf.
layer: requirement
