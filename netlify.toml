# Netlify hosts NON-PRODUCTION only (ADR-0009). Production runs on AWS (ADR-0005).
# Netlify's "production" context below is just the main-branch deploy of the
# development site; DH_ENV is still "development" there and the PREVIEW banner shows.

[build]
  base = "apps/web"
  # The guard fails the build if DH_ENV is "production" or missing.
  # apps/api is built first: netlify/functions/api.mts bundles its dist (ADR-0010 section 1).
  command = "node ../../scripts/assert-non-production.mjs && pnpm --filter @deemed/api build && DH_API_URL=\"${DH_API_URL:-$DEPLOY_PRIME_URL}\" pnpm run build"
  publish = ".next"
  # Netlify skips a build when nothing changed under the base directory
  # (apps/web). The web app also depends on workspace packages, so rebuild
  # when any of them, the lockfile, this file, or the build scripts change.
  # Exit 0 = skip, 1 = build. Paths are relative to apps/web.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../api ../../netlify ../../packages ../../pnpm-lock.yaml ../../package.json ../../netlify.toml ../../scripts"

# Declare the Next.js runtime explicitly. Auto-detection did not attach it in
# this monorepo (base = apps/web): deploys reported "No functions deployed", so
# every server-rendered page failed. The plugin creates the server handler.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# The API: one function at /api/* on the same origin as the web app (ADR-0010 section 1).
# Paths are relative to the base directory. Argon2 is a native module: keep it external.
[functions]
  directory = "../../netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@node-rs/argon2"]

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.33.0"
  DH_ENV = "development"
  NEXT_TELEMETRY_DISABLED = "1"

[context.production.environment]
  DH_ENV = "development"

[context.deploy-preview.environment]
  DH_ENV = "development"

[context.branch-deploy.environment]
  DH_ENV = "development"

[context.dev.environment]
  DH_ENV = "development"

# Headers for everything the CDN serves (static assets included). The Next.js
# app sets the same headers on rendered responses (apps/web/lib/security-headers.ts).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
